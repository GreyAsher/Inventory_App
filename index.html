<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏺</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory App</title>
    <meta name="description" content="Comprehensive inventory management system with stock tracking, sales invoicing, customer and supplier directories, and analytics." />
    <meta property="og:title" content="Inventory App" />
    <meta property="og:description" content="Comprehensive inventory management system with stock tracking, sales invoicing, customer and supplier directories, and analytics." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      };
      // Prevent flash of light mode on load
      (function() {
        try {
          var stored = localStorage.getItem('inventory_dark_mode');
          if (stored === 'true' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-gray-100 dark:bg-[#121417] text-gray-900 dark:text-gray-100 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
